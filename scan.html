<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live 3D Voxel Scanner</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #101020; color: #fff; overflow: hidden; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        #ui-overlay.hidden { display: none; }
        #ui-overlay h1 { margin-top: 0; }
        #ui-overlay p { max-width: 400px; margin: 1em auto; }
        #startScanBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background-color: #4CAF50; color: white; }
        #startScanBtn:disabled { background-color: #aaa; }
        
        #progressBarContainer { display: none; width: 80%; max-width: 400px; background-color: #333; border-radius: 5px; margin-top: 20px; }
        #progressBar { width: 0%; height: 20px; background-color: #4CAF50; border-radius: 5px; transition: width 0.1s; }
        #progressText { font-size: 1.1em; margin-top: 10px; }

        #webcamFeed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            max-width: 240px;
            border: 2px solid #fff;
            border-radius: 8px;
            display: none; /* Hidden by default */
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- UI for starting the scan -->
    <div id="ui-overlay">
        <h1>Live 3D Scanner</h1>
        <p>Place your object on a turntable against a plain, light-colored background.</p>
        
        <canvas id="silhouettePreview" width="320" height="240" style="border: 1px solid #555; margin-top: 1em; background-color: #000;"></canvas>
        <div id="settings" style="margin: 1em 0;">
            <label for="thresholdSlider">Silhouette Threshold: </label>
            <input type="range" id="thresholdSlider" min="0" max="255" value="120" style="vertical-align: middle;">
            <span id="thresholdValue" style="display: inline-block; width: 30px;">120</span>
        </div>
        <p>Adjust the slider until the object is solid black and the background is solid white in the preview above.</p>

        <button id="startScanBtn">Start Scan</button>
        <div id="progressBarContainer">
            <div id="progressBar"></div>
        </div>
        <p id="progressText"></p>
    </div>

    <!-- Hidden video element for webcam stream and a visible one for the feed -->
    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
    <video id="webcamFeed" autoplay playsinline muted></video>

    <!-- Import map to tell the browser where to find "three" -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/scanner.js"></script>
</body>
</html>
